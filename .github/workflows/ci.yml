name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_network:
        description: 'Run network-enabled HF Florence integration test'
        required: false
        default: 'false'

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f docker/requirements.txt ]; then pip install -r docker/requirements.txt; fi
          pip install pytest

      - name: Syntax check (compile all .py files)
        run: |
          python - <<'PY'
import glob, py_compile, sys
files = [f for f in glob.glob('**/*.py', recursive=True) if not f.startswith('.venv')]
errs = []
for f in files:
    try:
        py_compile.compile(f, doraise=True)
    except Exception as e:
        print('SYNTAX ERROR', f, e)
        errs.append(f)
if errs:
    sys.exit(2)
print('Python syntax check passed for', len(files), 'files')
PY

      - name: Run offline smoke tests if available
        run: |
          if [ -f scripts/test_florence_integration.py ]; then
            python scripts/test_florence_integration.py || echo 'smoke script failed'
          else
            echo 'no offline smoke script found, skipping'
          fi

  hf-integration:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_network == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install network test deps
        run: |
          python -m pip install --upgrade pip
          pip install transformers
      - name: Run HF Florence integration test
        run: |
          if [ -f scripts/test_florence_hf_integration.py ]; then
            python scripts/test_florence_hf_integration.py
          else
            echo 'no HF integration test script found'
          fi